# Production profile - real Bundesbank API, full load, file-based H2.
# Activate with: SPRING_PROFILES_ACTIVE=prod (env var or container config)
# Never bake secrets into this file - use env vars or secret manager.

# File-based H2 - data survives restarts, stored at ./data/fxrates-prod
spring.datasource.url=jdbc:h2:file:./data/fxrates-prod;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep schema up to date across restarts
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.jpa.show-sql=true
logging.level.com.crewmeister=INFO

# Disable sampling - load all FX rates from Bundesbank
bundesbank.sample-size=0
