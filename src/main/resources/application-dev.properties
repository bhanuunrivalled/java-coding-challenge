# Dev profile — runs full load on startup against the real Bundesbank API.
# Start with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Watch logs for: "FX rate store is empty — starting full load"
# Then hit: GET http://localhost:8080/api/currencies

# H2 console available at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:fxrates  User: sa  Password: (empty)
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:fxrates
spring.jpa.show-sql=false
