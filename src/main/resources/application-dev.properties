# Dev profile — calls the real Bundesbank API but samples only 15 random rows.
# Lets you verify the real CSV format and column structure without loading all history.
# Sampled rows are logged at DEBUG level — check logs to see exactly what was picked.
#
# Start with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# H2 console:  http://localhost:8080/h2-console
# JDBC URL:    jdbc:h2:mem:fxrates   User: sa   Password: (empty)

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:fxrates
spring.jpa.show-sql=true
logging.level.com.crewmeister=DEBUG

# Sample 15 random rows from the full Bundesbank CSV response
bundesbank.sample-size=15
