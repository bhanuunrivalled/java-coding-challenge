spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.jpa.open-in-view=false
spring.profiles.active=prod
fx.batch.full-load-on-startup=true
springdoc.swagger-ui.path=/swagger-ui.html

# Bundesbank API
bundesbank.api.base-url=https://api.statistiken.bundesbank.de/rest

# TODO understand them more Circuit breaker: open after 50% failures in last 10 calls, stay open 60s, then try 3 calls
resilience4j.circuitbreaker.instances.bundesbankApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.bundesbankApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bundesbankApi.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.bundesbankApi.permitted-number-of-calls-in-half-open-state=3

# Expose circuit breaker + metrics via actuator
management.endpoints.web.exposure.include=health,metrics,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Never expose stack traces in error responses
server.error.include-stacktrace=never
server.error.include-message=always
