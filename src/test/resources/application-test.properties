# Test profile - uses fixture CSV, never calls the real Bundesbank API.
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:fxrates-test
spring.jpa.show-sql=true
fx.batch.full-load-on-startup=false
spring.task.scheduling.enabled=false

# Point to the fixture CSV instead of Bundesbank
bundesbank.fixture.path=classpath:fixtures/BBEX3.D..EUR.BB.AC.000.csv

# Bundesbank API (overridden by fixture client in tests)
bundesbank.api.base-url=http://localhost:9999/fake
